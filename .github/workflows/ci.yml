name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and API tests (offline)
        run: pytest
      - name: Offline golden-set eval (pipeline sanity)
        run: make eval-offline

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lambda image
        run: docker build --platform linux/amd64 --provenance=false -t fielddocs-rag:ci .
      - name: Image imports cleanly
        run: >
          docker run --rm --entrypoint python
          -e APP_ENV=test -e AUTH_MODE=none -e LLM_PROVIDER=fake -e VECTOR_STORE=memory -e STORAGE_BACKEND=memory
          fielddocs-rag:ci -c "import app.lambda_api, app.ingestion.handler; print('ok')"
